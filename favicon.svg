<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0055ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0099ff"/>
      <stop offset="100%" style="stop-color:#0033cc"/>
    </linearGradient>
    <linearGradient id="g3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00cfff"/>
      <stop offset="100%" style="stop-color:#0044dd"/>
    </linearGradient>
  </defs>

  <!-- Left wing of the V -->
  <path d="M8,12 C14,10 24,16 32,30 L48,65 C42,57 33,45 22,36 C15,30 7,26 8,12 Z"
        fill="url(#g1)"/>

  <!-- Right long blade (paper plane / pen nib shape) -->
  <path d="M52,8 C58,5 67,10 70,20 L50,80 C48,70 46,55 44,40 C42,26 46,13 52,8 Z"
        fill="url(#g2)"/>

  <!-- Lower right teardrop blade -->
  <path d="M44,42 L50,80 C52,88 54,94 48,96 C42,92 40,83 38,72 L35,56 Z"
        fill="url(#g3)" opacity="0.92"/>

  <!-- Dark gap for depth -->
  <path d="M44,40 C46,44 47,50 46,58 L44,42 Z"
        fill="#001133" opacity="0.5"/>

  <!-- Teardrop notch detail -->
  <ellipse cx="50" cy="50" rx="3" ry="5" fill="#001a55" opacity="0.6" transform="rotate(-25 50 50)"/>

  <!-- Cyan tip accents -->
  <path d="M68,18 C70,14 72,12 70,20 C69,18 68,18 68,18 Z" fill="#00eeff" opacity="0.9"/>
  <path d="M8,12 C10,8 16,8 18,13 C14,13 10,13 8,12 Z" fill="#00eeff" opacity="0.8"/>
</svg>
